name: MCP Protocol Lab

on:
  push:
    branches: [main, feat/brand-strategy-identity-kit]
    paths:
      - "tests/mcp_lab/**"
      - "tests/__init__.py"
      - ".github/workflows/mcp-lab.yml"
  pull_request:
    paths:
      - "tests/mcp_lab/**"
      - "tests/__init__.py"
      - ".github/workflows/mcp-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/mcp_lab/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/mcp_lab/requirements.txt
      - name: Run MCP protocol tests
        run: python -m pytest -q tests/mcp_lab
